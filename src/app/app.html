<!-- Intro Door (full-screen overlay — hides when opened) -->
<app-intro-door (doorOpened)="onDoorOpened()" />

<!-- Floating Subtle Pearl Sparkle Ambient Layer -->
<div class="cashmere-ambient-layer" aria-hidden="true" [class.visible]="doorOpen()">
  <span class="ambient-glow glow-1"></span>
  <span class="ambient-glow glow-2"></span>
  <span class="pearl-sparkle sparkle-1">✦</span>
  <span class="pearl-sparkle sparkle-2">✧</span>
  <span class="pearl-sparkle sparkle-3">✦</span>
</div>

<!-- Main Wedding Content (visible after door opens) -->
<main class="wedding-content" [class.visible]="doorOpen()">
  <!-- Royal Arched Invitation Card -->
  <app-hero />

  <!-- Haute-Couture Cashmere Divider -->
  <div class="cashmere-interlude" aria-hidden="true">
    <span class="interlude-line"></span>
    <span class="interlude-monogram">ن ♡ ش</span>
    <span class="interlude-line"></span>
  </div>

  <!-- Refined Luxury Countdown Strip -->
  <app-countdown-timer />

  <!-- Professional Venue & Maps Showcase -->
  <app-location-section />

  <!-- Add to Calendar -->
  <app-add-to-calendar />

  <!-- Social Sharing -->
  <app-share-section />

  <!-- Closing Blessing & Designer Portfolio Footer -->
  <app-closing-section />
</main>

<!-- Toast Notification -->
@if (shareService.toastMessage()) {
  <div class="toast show">{{ shareService.toastMessage() }}</div>
}
