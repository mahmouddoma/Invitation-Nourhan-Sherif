<section class="location-section" appScrollReveal>
  <div class="location-container">
    <!-- Section Header -->
    <div class="location-header text-center">
      <span class="location-eyebrow">مكان الحفل</span>
      <h2 class="location-title">{{ config.venueName }}</h2>
      <p class="location-subtitle">{{ config.venueName }} — {{ config.venueAddress }}</p>
    </div>

    <!-- Venue Card Content -->
    <div class="location-content-grid">
      <!-- Actions Panel -->
      <div class="location-actions-panel">
        <p class="location-desc">
          مستنيينكم تنورونا وتفرحوا معانا في <strong>{{ config.venueName }}</strong>. تقدروا تفتحوا اللوكيشن مباشرة على
          الخريطة أو تشيروه بكل سهولة مع حبايبكم.
        </p>

        <div class="location-buttons">
          <button class="venue-btn primary-btn" (click)="openLocation()" aria-label="افتح اللوكيشن على الخريطة">
            <span>افتح اللوكيشن على الخريطة</span>
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21 C16 16 20 12.5 20 8.5 A8 8 0 0 0 4 8.5 C4 12.5 8 16 12 21 Z" />
                <circle cx="12" cy="8.5" r="2.5" />
              </svg>
            </span>
          </button>

          <button class="venue-btn secondary-btn" (click)="shareLocation()" aria-label="مشاركة مكان القاعة">
            <span>مشاركة مكان القاعة</span>
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
              </svg>
            </span>
          </button>

          <button class="venue-btn ghost-btn" (click)="copyLocationLink()" aria-label="نسخ رابط المكان">
            <span>نسخ رابط المكان</span>
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
            </span>
          </button>
        </div>
      </div>

      <!-- QR Code Floating Card -->
      <div class="location-qr-panel">
        <div class="qr-card">
          <div class="qr-frame">
            <img [src]="config.locationQrImage" alt="QR Code — موقع حفل الزفاف" class="qr-img" loading="lazy" />
          </div>
          <span class="qr-caption">امسح الكود بالموبايل لفتح اللوكيشن فوراً</span>
        </div>
      </div>
    </div>
  </div>
</section>
