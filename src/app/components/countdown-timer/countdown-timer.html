<section class="countdown-section" appScrollReveal>
  <div class="countdown-container">
    <p class="countdown-eyebrow">العد التنازلي لليلة العمر</p>

    <!-- Luxury Seamless Countdown Strip -->
    <div class="countdown-strip">
      <!-- Days -->
      <div class="countdown-unit" #digitBox>
        <strong class="countdown-num">{{ formatNum(countdown().days) }}</strong>
        <span class="countdown-tag">يوم</span>
      </div>

      <span class="countdown-sep">:</span>

      <!-- Hours -->
      <div class="countdown-unit" #digitBox>
        <strong class="countdown-num">{{ formatNum(countdown().hours) }}</strong>
        <span class="countdown-tag">ساعة</span>
      </div>

      <span class="countdown-sep">:</span>

      <!-- Minutes -->
      <div class="countdown-unit" #digitBox>
        <strong class="countdown-num">{{ formatNum(countdown().minutes) }}</strong>
        <span class="countdown-tag">دقيقة</span>
      </div>

      <span class="countdown-sep">:</span>

      <!-- Seconds -->
      <div class="countdown-unit" #digitBox>
        <strong class="countdown-num">{{ formatNum(countdown().seconds) }}</strong>
        <span class="countdown-tag">ثانية</span>
      </div>
    </div>
  </div>
</section>
