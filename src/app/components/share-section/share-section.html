<section class="share-section" appScrollReveal>
  <div class="share-container">
    <div class="share-card">
      <span class="share-eyebrow">فرحتنا بتكمل بيكم</span>
      <h3 class="share-title">شير الدعوة لحبايبك</h3>

      <div class="social-buttons-grid">
        <!-- WhatsApp -->
        <button
          class="social-btn whatsapp"
          (click)="shareWhatsApp()"
          aria-label="مشاركة عبر واتساب"
        >
          <span class="btn-label">واتساب</span>
          <svg class="social-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path
              d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.04 14.69 2 12.04 2M12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 15 3.8 13.47 3.8 11.91C3.81 7.37 7.5 3.67 12.05 3.67M9.53 7.34C9.36 7.34 9.08 7.4 8.85 7.65C8.61 7.9 7.95 8.52 7.95 9.77C7.95 11.03 8.87 12.24 9 12.41C9.13 12.58 10.8 15.15 13.36 16.26C13.97 16.52 14.44 16.68 14.81 16.8C15.42 16.99 15.98 16.96 16.42 16.9C16.91 16.83 17.93 16.28 18.14 15.69C18.35 15.1 18.35 14.6 18.29 14.5C18.23 14.4 18.06 14.34 17.8 14.21C17.55 14.09 16.3 13.48 16.07 13.39C15.84 13.31 15.68 13.27 15.51 13.52C15.34 13.77 14.86 14.34 14.71 14.5C14.56 14.68 14.42 14.7 14.16 14.58C13.91 14.45 13.1 14.19 12.14 13.34C11.39 12.67 10.89 11.85 10.74 11.6C10.6 11.35 10.73 11.22 10.85 11.1C10.96 10.98 11.11 10.8 11.23 10.65C11.35 10.5 11.39 10.4 11.48 10.23C11.56 10.06 11.52 9.92 11.46 9.8C11.4 9.67 10.9 8.46 10.7 7.96C10.5 7.48 10.3 7.54 10.14 7.53C10 7.53 9.83 7.53 9.66 7.53C9.49 7.53 9.32 7.34 9.53 7.34Z"
            />
          </svg>
        </button>

        <!-- Facebook -->
        <button
          class="social-btn facebook"
          (click)="shareFacebook()"
          aria-label="مشاركة عبر فيسبوك"
        >
          <span class="btn-label">Facebook</span>
          <svg class="social-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
            />
          </svg>
        </button>

        <!-- X (Twitter) -->
        <button class="social-btn xshare" (click)="shareX()" aria-label="مشاركة عبر X / تويتر">
          <span class="btn-label">X </span>
          <svg class="social-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
            />
          </svg>
        </button>

        <!-- Instagram -->
        <button
          class="social-btn instagram"
          (click)="shareInstagram()"
          aria-label="مشاركة عبر إنستجرام"
        >
          <span class="btn-label">Instagram</span>
          <svg class="social-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path
              d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
            />
          </svg>
        </button>

        <!-- TikTok -->
        <button class="social-btn tiktok" (click)="shareTikTok()" aria-label="مشاركة عبر تيك توك">
          <span class="btn-label">TikTok</span>
          <svg class="social-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path
              d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.29 0 .58.04.85.11V9.4a6.33 6.33 0 0 0-1-.08A6.34 6.34 0 0 0 3 15.66a6.34 6.34 0 0 0 10.81 4.48 6.3 6.3 0 0 0 1.94-4.52V8.75a8.28 8.28 0 0 0 4.84 1.56V6.85a4.87 4.87 0 0 1-1-.16z"
            />
          </svg>
        </button>

        <!-- Native / Other Share -->
        <button
          class="social-btn native-share"
          (click)="shareNative()"
          aria-label="مشاركة عبر خيارات أخرى"
        >
          <span class="btn-label">مشاركة أخرى</span>
          <svg
            class="social-svg"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
            <polyline points="16 6 12 2 8 6" />
            <line x1="12" y1="2" x2="12" y2="15" />
          </svg>
        </button>
      </div>

      <p class="share-hint">
        في إنستجرام وتيك توك، الرابط هيتنسخ معاك تلقائياً عشان تشيره بكل سهولة.
      </p>
    </div>
  </div>
</section>
