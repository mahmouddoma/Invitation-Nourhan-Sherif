<section class="closing-section" appScrollReveal>
  <div class="closing-container">
    <!-- Closing Blessing -->
    <div class="closing-card">
      <div class="closing-rose-crowning">
        <img src="images/single_peach_rose_trans.png" alt="" class="closing-rose-img" />
      </div>
      <span class="closing-heart">♡</span>
      <h3 class="closing-heading">{{ config.closingMessage }}</h3>
      <p class="closing-text">
        {{ config.closingSubMessage }}
      </p>

      <div class="closing-ornament">
        <span class="ornament-line"></span>
        <span class="ornament-glyph">
          <svg
            viewBox="0 0 48 20"
            width="44"
            height="18"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M24 2 L25.6 7.2 L31 5.8 L28 10 L31 14.2 L25.6 12.8 L24 18 L22.4 12.8 L17 14.2 L20 10 L17 5.8 L22.4 7.2 Z"
              fill="#C9922B"
            />
            <circle cx="24" cy="10" r="1.5" fill="#FFFDF8" />
            <circle cx="8" cy="10" r="2" fill="#C9922B" opacity="0.6" />
            <circle cx="40" cy="10" r="2" fill="#C9922B" opacity="0.6" />
            <circle cx="1" cy="10" r="1" fill="#C9922B" opacity="0.3" />
            <circle cx="47" cy="10" r="1" fill="#C9922B" opacity="0.3" />
          </svg>
        </span>
        <span class="ornament-line"></span>
      </div>
    </div>

    <!-- Page Footer -->
    <footer class="wedding-footer">
      <p class="footer-names">
        <span>{{ config.brideName }}</span>
        <span class="footer-heart">♡</span>
        <span>{{ config.groomName }}</span>
      </p>
      <small class="footer-date">الجمعة، 23 أكتوبر 2026 — {{ config.weddingTime }}</small>

      <!-- Powered By Mahmoud Doma Badge -->
      <div class="footer-badge-wrapper">
        <a
          href="https://mahmouddoma.github.io/md-portfolioo/"
          target="_blank"
          rel="noopener noreferrer"
          class="designer-badge"
          aria-label="Powered by Mahmoud Doma"
        >
          <span class="badge-icon">✦</span>
          <span class="badge-text">Powered by <strong>Mahmoud Doma</strong></span>
        </a>
      </div>
    </footer>
  </div>
</section>
