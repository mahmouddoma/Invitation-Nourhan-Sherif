<section class="closing-section" appScrollReveal>
  <div class="closing-container">
    <!-- Closing Blessing Card -->
    <div class="closing-card">
      <div class="closing-pearl-emblem" aria-hidden="true">
        <span class="emblem-sparkle">✦</span>
        <span class="emblem-heart">♡</span>
        <span class="emblem-sparkle">✦</span>
      </div>
      <h3 class="closing-heading">{{ config.closingMessage }}</h3>
      <p class="closing-text">
        {{ config.closingSubMessage }}
      </p>
    </div>

    <!-- Page Footer -->
    <footer class="wedding-footer">
      <p class="footer-names">
        <span class="f-bride">{{ config.brideName }}</span>
        <span class="footer-heart">♡</span>
        <span class="f-groom">{{ config.groomName }}</span>
      </p>
      <p class="footer-script-names">Nourhan &amp; Sherif</p>
      <small class="footer-date">الجمعة، 13 نوفمبر 2026 — {{ config.weddingTime }}</small>

      <!-- Powered By Mahmoud Doma Badge -->
      <div class="footer-badge-wrapper">
        <a href="https://mahmouddoma.github.io/md-portfolioo/" target="_blank" rel="noopener noreferrer"
          class="designer-badge" aria-label="Powered by Mahmoud Doma">
          <span class="badge-icon">✦</span>
          <span class="badge-text">Powered by <strong>Mahmoud Doma</strong></span>
        </a>
      </div>
    </footer>
  </div>
</section>
