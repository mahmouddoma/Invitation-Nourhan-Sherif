<section
  class="door-screen intro-screen"
  id="doorScreen"
  [class.hidden]="isOpen()"
  [class.opening]="isOpening()"
  (click)="onScreenClick()"
  (touchstart)="onScreenClick()"
  aria-label="فتح الدعوة"
>
  <!-- Background Ambient / Watercolor Wash -->
  <div class="intro-bg-ambient"></div>

  <!-- Top-Left Corner: Watercolor Peach & Yellow Roses Bouquet (Pure Transparent PNG) -->
  <div class="corner-floral-wrapper">
    <img
      src="images/peach_floral_corner_trans.png"
      alt=""
      class="corner-floral corner-floral-tl"
      aria-hidden="true"
    />
  </div>

  <!-- Bottom-Right Corner: Golden Lineart Lotus Flower (Pure Transparent PNG) -->
  <div class="corner-lineart-wrapper">
    <img
      src="images/botanical_lineart_flower_trans.png"
      alt=""
      class="corner-lineart corner-lineart-br"
      aria-hidden="true"
    />
  </div>

  <!-- Top Controls: Anchored gracefully at Top-Right so it never covers the flowers -->
  <header class="top-controls">
    <div class="top-monogram" aria-hidden="true">
      <span class="mono-initial">ف</span>
      <span class="mono-heart">♡</span>
      <span class="mono-initial">ر</span>
    </div>

    <button
      class="control-btn music-btn"
      (click)="toggleMusic(); $event.stopPropagation()"
      [attr.aria-label]="musicPlaying() ? 'إيقاف الموسيقى' : 'تشغيل الموسيقى'"
      [class.playing]="musicPlaying()"
      type="button"
    >
      @if (musicPlaying()) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <line x1="23" y1="9" x2="17" y2="15" />
          <line x1="17" y1="9" x2="23" y2="15" />
        </svg>
      }
    </button>
  </header>

  <!-- Central Arched Wedding Card Container -->
  <div class="arched-card-container" [class.card-opening]="isOpening()" #doorWrapEl>
    <div class="arched-card">
      <!-- Top Decorative Star Accent -->
      <div class="card-top-accent">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path
            d="M12 2 L14 8 L20 8 L15 12 L17 18 L12 14 L7 18 L9 12 L4 8 L10 8 Z"
            fill="#c8963e"
            opacity="0.85"
          />
        </svg>
      </div>

      <!-- Couple Names in Dark Royal Navy with Cairo font -->
      <div class="card-names-block">
        <h1 class="card-names-primary">
          <span class="name-part">{{ config.brideName }}</span>
          <span class="name-amp">&amp;</span>
          <span class="name-part">{{ config.groomName }}</span>
        </h1>
        <p class="card-names-en">Fatma &amp; Ramadan</p>
      </div>

      <!-- Invitation Subtitle -->
      <div class="card-invite-sub">
        <p class="invite-ar">يتشرفون بدعوتكم لحضور حفل زفافهم</p>
        <p class="invite-en">INVITE YOU TO JOIN THEIR WEDDING CELEBRATION</p>
      </div>

      <!-- Date Trio Badge (SAT | 19 JULY | AT 8 PM style) -->
      <div class="card-date-trio">
        <div class="date-col">
          <span class="date-lbl">الجمعة</span>
          <span class="date-sub">FRI</span>
        </div>
        <div class="date-vsep"></div>
        <div class="date-col date-col-main">
          <span class="date-day-num">23</span>
          <span class="date-month-txt">أكتوبر • OCT</span>
        </div>
        <div class="date-vsep"></div>
        <div class="date-col">
          <span class="date-lbl">7:30 م</span>
          <span class="date-sub">AT 7:30 PM</span>
        </div>
      </div>

      <!-- Venue Title with Fine Border -->
      <div class="card-venue-row">
        <span class="venue-line"></span>
        <p class="card-venue-txt">{{ config.venueName }} • PORTO SEIF</p>
        <span class="venue-line"></span>
      </div>

      <!-- Bride and Groom Cutout Photo -->
      <div class="card-couple-photo-wrapper">
        <img src="images/couple.png" alt="فاطمة ورمضان" class="card-couple-img" loading="eager" />
        <div class="couple-fade-overlay"></div>
      </div>

      <!-- Floating Stable Interactive Button (اضغط لفتح تفاصيل الدعوة) -->
      <div class="card-action-bar">
        <button
          class="royal-open-invitation-btn"
          id="openInvitation"
          type="button"
          #openBtnEl
          (click)="openDoor(); $event.stopPropagation()"
          [disabled]="isOpen() || isOpening()"
          [class.btn-unlocking]="isOpening()"
          aria-label="اضغط لفتح دعوة الزفاف"
        >
          <span class="btn-sparkle-icon">✦</span>
          <span class="btn-main-label">اضغط لفتح الدعوة</span>
          <span class="btn-arrow-icon">♡</span>
        </button>
      </div>
    </div>
  </div>
</section>

<!-- Background Audio Element -->
<audio id="wedding-audio" loop preload="auto">
  <source [src]="config.audioSrc" type="audio/mpeg" />
</audio>
