<section class="door-screen intro-screen" id="doorScreen" [class.hidden]="isOpen()" [class.opening]="isOpening()"
  (click)="onScreenClick()" (touchstart)="onScreenClick()" aria-label="فتح الدعوة">
  <!-- Background Ambient / Luxury Pearl Silk Wash -->
  <div class="intro-bg-ambient"></div>

  <!-- Top Controls: Anchored gracefully at Top-Left so it never covers the pearl bouquet -->
  <header class="top-controls">
    <div class="top-monogram" aria-hidden="true">
      <span class="mono-initial">ن</span>
      <span class="mono-heart">♡</span>
      <span class="mono-initial">ش</span>
    </div>

    <button class="control-btn music-btn" (click)="toggleMusic(); $event.stopPropagation()"
      [attr.aria-label]="musicPlaying() ? 'إيقاف الموسيقى' : 'تشغيل الموسيقى'" [class.playing]="musicPlaying()"
      type="button">
      @if (musicPlaying()) {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
      </svg>
      } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
        <line x1="23" y1="9" x2="17" y2="15" />
        <line x1="17" y1="9" x2="23" y2="15" />
      </svg>
      }
    </button>
  </header>

  <!-- Central Arched Wedding Card Container -->
  <div class="arched-card-container" [class.card-opening]="isOpening()" #doorWrapEl>
    <!-- Top-Right Pearl & Crystal Jewelry Cascade (Adorning the Card Directly in Front) -->
    <div class="card-pearl-tr-wrapper" aria-hidden="true">
      <img src="images/pearl_floral_tr_trans.png" alt="" class="card-pearl-tr corner-pearl-tr" />
    </div>

    <!-- Bottom-Left Pearl & Crystal Jewelry Filigree (Adorning the Card Directly in Front) -->
    <div class="card-pearl-bl-wrapper" aria-hidden="true">
      <img src="images/pearl_floral_bottom_left.png" alt="" class="card-pearl-bl corner-pearl-bl" />
    </div>

    <div class="arched-card">
      <!-- 1. Editorial Classical Header (Matching Reference Image) -->
      <div class="card-save-date-block">
        <span class="save-date-txt">SAVE THE DATE</span>
        <span class="wedding-of-txt">FOR THE WEDDING OF</span>
        <p class="invite-ar-elegant">يتشرفون بدعوتكم لحضور حفل زفافهم</p>
      </div>

      <!-- 2. The Names: Classical Arabic Calligraphy + English Copperplate Script -->
      <div class="card-names-block">
        <h1 class="card-names-arabic">
          <span class="name-part">{{ config.brideName }}</span>
          <span class="name-amp">&amp;</span>
          <span class="name-part">{{ config.groomName }}</span>
        </h1>
        <p class="card-names-script">Nourhan &amp; Sherif</p>
      </div>

      <!-- 3. Classic Spaced Roman Date (Matching 07.09.2024 Reference Style) -->
      <div class="card-date-classic">
        <div class="date-numbers-spaced">13 . 11 . 2026</div>
        <div class="date-meta-row">
          <span class="date-meta-item">الجمعة • FRI</span>
          <span class="date-meta-dot">•</span>
          <span class="date-meta-item">8:00 مساءً • AT 8 PM</span>
        </div>
        <div class="venue-row-classic">
          <span class="venue-line-refined"></span>
          <p class="venue-classic-txt">{{ config.venueName }} • HILTON HOTEL</p>
          <span class="venue-line-refined"></span>
        </div>
      </div>

      <!-- 4. Bride and Groom Royal Arched Portrait Frame -->
      <div class="card-couple-photo-wrapper">
        <div class="couple-arched-frame">
          <img src="images/nourhan_sherif_arched.png" alt="نورهان وشريف" class="card-couple-img" loading="eager" />
        </div>
      </div>

      <!-- 5. Floating Stable Interactive Button -->
      <div class="card-action-bar">
        <button class="royal-open-invitation-btn" id="openInvitation" type="button" #openBtnEl
          (click)="openDoor(); $event.stopPropagation()" [disabled]="isOpen() || isOpening()"
          [class.btn-unlocking]="isOpening()" aria-label="اضغط لفتح دعوة الزفاف">
          <span class="btn-sparkle-icon">✦</span>
          <span class="btn-main-label">اضغط لفتح تفاصيل الدعوة</span>
          <span class="btn-arrow-icon">♡</span>
        </button>
      </div>
    </div>
  </div>
</section>

<!-- Background Audio Element -->
<audio id="wedding-audio" [src]="config.audioSrc" autoplay loop preload="auto" playsinline webkit-playsinline>
  <source [src]="config.audioSrc" type="audio/mpeg" />
  <source src="wedding-song.mp3" type="audio/mpeg" />
  <source src="music.mp3" type="audio/mpeg" />
</audio>
