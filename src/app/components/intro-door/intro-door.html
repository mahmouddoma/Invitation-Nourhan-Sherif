<section class="door-screen intro-screen" id="doorScreen" [class.hidden]="isOpen()" [class.opening]="isOpening()"
  (click)="onScreenClick()" (touchstart)="onScreenClick()" aria-label="فتح الدعوة">
  <!-- Background Ambient / Luxury Pearl Silk Wash -->
  <div class="intro-bg-ambient"></div>

  <!-- Ambient Floating Pearl & Gold Dust Particles -->
  <div class="floating-pearl-dust-field" aria-hidden="true">
    <span class="pearl-dust p1"></span>
    <span class="pearl-dust p2"></span>
    <span class="pearl-dust p3"></span>
    <span class="pearl-dust p4"></span>
    <span class="pearl-dust p5"></span>
    <span class="pearl-dust p6"></span>
    <span class="pearl-dust p7"></span>
    <span class="pearl-dust p8"></span>
    <span class="pearl-dust p9"></span>
    <span class="pearl-dust p10"></span>
    <span class="pearl-dust p11"></span>
    <span class="pearl-dust p12"></span>
  </div>

  <!-- Top-Right Pearl & Crystal Floral (Screen Corner — Z-INDEX 50) -->
  <div class="corner-pearl-tr-wrapper" aria-hidden="true">
    <img src="images/pearl_floral_tr_trans.png" alt="" class="corner-pearl-tr" />
  </div>

  <!-- Bottom-Left Pearl & Crystal Floral (Screen Corner — Z-INDEX 50) -->
  <div class="corner-pearl-bl-wrapper" aria-hidden="true">
    <img src="images/pearl_floral_bottom_left.png" alt="" class="corner-pearl-bl" />
  </div>

  <!-- Top Controls: Monogram Badge & Music -->
  <header class="top-controls">
    <div class="top-monogram" aria-hidden="true">
      <span class="mono-initial">ن</span>
      <span class="mono-heart">♡</span>
      <span class="mono-initial">ش</span>
    </div>

    <button class="control-btn music-btn" (click)="toggleMusic(); $event.stopPropagation()"
      [attr.aria-label]="musicPlaying() ? 'إيقاف الموسيقى' : 'تشغيل الموسيقى'" [class.playing]="musicPlaying()"
      type="button">
      @if (musicPlaying()) {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
      </svg>
      } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
        <line x1="23" y1="9" x2="17" y2="15" />
        <line x1="17" y1="9" x2="23" y2="15" />
      </svg>
      }
    </button>
  </header>

  <!-- Central Pure Royal Monogram Stage — Minimalist, Clean & Regal -->
  <div class="royal-monogram-stage" [class.stage-opening]="isOpening()" #doorWrapEl>
    <!-- Soft Ambient Halo Aura -->
    <div class="stage-ambient-aura" aria-hidden="true"></div>

    <!-- Editorial Minimal Eyebrow -->
    <div class="mono-editorial-eyebrow">
      <span class="eyebrow-dash"></span>
      <span class="eyebrow-text">WEDDING INVITATION</span>
      <span class="eyebrow-dash"></span>
    </div>

    <!-- Royal Arabic Calligraphy Names -->
    <h1 class="mono-arabic-names">
      <span class="name-part">{{ config.brideName }}</span>
      <span class="name-amp">&amp;</span>
      <span class="name-part">{{ config.groomName }}</span>
    </h1>

    <!-- Flowing English Script -->
    <p class="mono-script-names">Nourhan &amp; Sherif</p>

    <!-- Classic Spaced Roman Date -->
    <div class="mono-date-row">
      <span class="date-dash"></span>
      <span class="date-digits">13 . 11 . 2026</span>
      <span class="date-dash"></span>
    </div>

    <!-- Seal & Full-Width Silk Belly Band Interactive Zone -->
    <div class="seal-ribbon-stage-zone">
      <!-- Full-Width Luxury Cashmere Silk Belly Band (Spanning 100vw Behind Seal) -->
      <div class="silk-belly-band-full" [class.band-unraveling]="isOpening()" aria-hidden="true">
        <div class="ribbon-wing ribbon-wing-left">
          <span class="ribbon-edge-stitch"></span>
          <span class="ribbon-sheen"></span>
          <span class="ribbon-edge-stitch bottom"></span>
        </div>
        <div class="ribbon-wing ribbon-wing-right">
          <span class="ribbon-edge-stitch"></span>
          <span class="ribbon-sheen"></span>
          <span class="ribbon-edge-stitch bottom"></span>
        </div>
      </div>

      <!-- 3D Wax Seal & Interactive Touchpoint -->
      <div class="wax-seal-interactive-anchor" [class.seal-unlocked]="isOpening()"
        (click)="openDoor(); $event.stopPropagation()" (touchstart)="openDoor(); $event.stopPropagation()" role="button"
        tabindex="0" aria-label="المس الختم الملكي لفتح الدعوة">
        <div class="seal-halo-pulse" aria-hidden="true"></div>
        <img src="images/gold_pearl_wax_seal.png" alt="ختم نورهان وشريف الملكي" class="seal-graphic-img" />
        <div class="seal-inviting-pill">
          <span class="pill-sparkle">✦</span>
          <span class="pill-txt">المس الختم لفتح الدعوة</span>
          <span class="pill-sparkle">✦</span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Background Audio Element -->
<audio id="wedding-audio" [src]="config.audioSrc" autoplay loop preload="auto" playsinline webkit-playsinline>
  <source [src]="config.audioSrc" type="audio/mpeg" />
  <source src="wedding-song.mp3" type="audio/mpeg" />
  <source src="music.mp3" type="audio/mpeg" />
</audio>
