<section class="event-cards-section section">
  <div class="container">
    <div class="row g-4 justify-content-center">
      <!-- Location Card -->
      <div class="col-12 col-sm-6 col-lg-4" appScrollReveal>
        <div class="event-card">
          <div class="event-icon-wrapper icon-terracotta">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
          </div>
          <h3 class="event-label">المكان</h3>
          <p class="event-value">{{ config.venueName }}</p>
          <p class="event-address">{{ config.venueAddress }}</p>
          <button class="btn-location" (click)="openLocation()">اضغط لفتح اللوكيشن</button>
        </div>
      </div>

      <!-- Time Card -->
      <div class="col-12 col-sm-6 col-lg-4" appScrollReveal [revealDelay]="0.1">
        <div class="event-card">
          <div class="event-icon-wrapper icon-olive">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
          </div>
          <h3 class="event-label">الموعد</h3>
          <p class="event-value">{{ config.weddingTime }}</p>
        </div>
      </div>

      <!-- Date Card -->
      <div class="col-12 col-sm-6 col-lg-4" appScrollReveal [revealDelay]="0.2">
        <div class="event-card">
          <div class="event-icon-wrapper icon-gold">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
          </div>
          <h3 class="event-label">التاريخ</h3>
          <p class="event-value">الجمعة، 13 نوفمبر 2026</p>
        </div>
      </div>
    </div>
  </div>
</section>
