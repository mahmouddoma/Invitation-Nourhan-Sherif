<section class="calendar-section" appScrollReveal>
  <div class="calendar-container">
    <div class="calendar-card">
      <div class="calendar-copy">
        <span class="calendar-eyebrow">احفظوا الميعاد</span>
        <h3 class="calendar-title">سجلوا يوم فرحنا في النتيجة</h3>
      </div>

      <button
        class="calendar-action-btn"
        (click)="downloadCalendar()"
        aria-label="إضافة الميعاد إلى التقويم"
      >
        <span>ضيف الميعاد للتقويم</span>
        <span class="btn-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="3" ry="3" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
            <line x1="12" y1="14" x2="12" y2="18" />
            <line x1="10" y1="16" x2="14" y2="16" />
          </svg>
        </span>
      </button>
    </div>
  </div>
</section>
