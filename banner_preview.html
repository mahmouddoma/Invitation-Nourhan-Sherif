<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@600;700;800&family=Cinzel:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f2f7fc;
      font-family: 'Cairo', sans-serif;
    }

    .banner-container {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%,
          #ffffff 0%,
          rgba(245, 250, 255, 0.9) 45%,
          rgba(225, 238, 250, 0.95) 100%);
      padding: 24px;
    }

    /* Botanical Corners */
    .corner-img {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }

    .corner-tl {
      top: -15px;
      left: -15px;
      width: 320px;
      transform: scaleX(-1);
    }

    .corner-tr {
      top: -15px;
      right: -15px;
      width: 320px;
    }

    .corner-bl {
      bottom: -20px;
      left: -20px;
      width: 330px;
      transform: scaleX(-1);
    }

    .corner-br {
      bottom: -20px;
      right: -20px;
      width: 330px;
    }

    /* Inner Arch Card */
    .inner-card {
      position: relative;
      z-index: 2;
      width: 980px;
      height: 570px;
      border-radius: 36px;
      border: 2px solid #d4b47e;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      box-shadow:
        0 20px 45px rgba(50, 75, 105, 0.12),
        inset 0 0 0 4px rgba(255, 255, 255, 0.9),
        inset 0 0 0 6px rgba(212, 180, 126, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 40px 28px;
      text-align: center;
    }

    /* Quranic Verse / Basmala */
    .verse-text {
      font-family: 'Amiri', serif;
      font-size: 26px;
      font-weight: 700;
      color: #b87d18;
      background: linear-gradient(180deg, #df9f2e 0%, #b37715 50%, #8c5506 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 2px rgba(100, 68, 16, 0.3));
      line-height: 1.3;
      max-width: 820px;
    }

    .sub-invite {
      font-size: 20px;
      font-weight: 700;
      color: #38526d;
      letter-spacing: 0.02em;
    }

    /* Centerpiece Names */
    .names-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      direction: rtl;
      margin: 4px 0;
    }

    .name-val {
      font-family: 'Amiri', serif;
      font-size: 78px;
      font-weight: 700;
      line-height: 1.1;
      color: #b87d18;
      background: linear-gradient(180deg, #e5aa3a 0%, #bd8019 45%, #8c5506 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 6px rgba(100, 68, 16, 0.4));
      padding: 0 8px;
    }

    .gold-amp {
      font-family: 'Cinzel', serif;
      font-size: 52px;
      font-weight: 700;
      color: #c8963e;
      filter: drop-shadow(0 2px 4px rgba(100, 68, 16, 0.3));
    }

    /* Event Trio Bar */
    .details-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      width: 100%;
      max-width: 800px;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #f0f6fb);
      border: 1.5px solid #d4b47e;
      box-shadow: 0 4px 16px rgba(50, 75, 105, 0.08);
      direction: ltr;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 19px;
      font-weight: 700;
      color: #2c4257;
    }

    .detail-sep {
      width: 1.5px;
      height: 24px;
      background: #d4b47e;
    }

    .detail-icon {
      color: #c8963e;
      font-size: 20px;
    }

    .footer-greeting {
      font-family: 'Amiri', serif;
      font-size: 26px;
      font-weight: 700;
      color: #38526d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .heart-mini {
      color: #c8963e;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="banner-container">
    <!-- 4 Botanical Corners -->
    <img src="images/botanical_tr_trans.png" class="corner-img corner-tr" alt="" />
    <img src="images/botanical_tl_trans.png" class="corner-img corner-tl" alt="" />
    <img src="images/botanical_br_trans.png" class="corner-img corner-br" alt="" />
    <img src="images/botanical_bl_trans.png" class="corner-img corner-bl" alt="" />

    <div class="inner-card">
      <div class="verse-text">
        وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنْفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا
        وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً
      </div>

      <div class="sub-invite">يتشرف الأهل بدعوتكم لحضور حفل زفاف</div>

      <div class="names-row">
        <span class="name-val">نورهان</span>
        <span class="gold-amp">&</span>
        <span class="name-val">شريف</span>
      </div>

      <div class="details-bar">
        <div class="detail-item">
          <span class="detail-icon">📅</span>
          <span>الجمعة، 13 نوفمبر 2026</span>
        </div>
        <div class="detail-sep"></div>
        <div class="detail-item">
          <span class="detail-icon">🕒</span>
          <span>الساعة 8:00 مساءً</span>
        </div>
        <div class="detail-sep"></div>
        <div class="detail-item">
          <span class="detail-icon">📍</span>
          <span>قاعة هيلتون</span>
        </div>
      </div>

      <div class="footer-greeting">
        <span>—</span>
        <span class="heart-mini">♡</span>
        <span>بحضوركم تكتمل فرحتنا</span>
        <span class="heart-mini">♡</span>
        <span>—</span>
      </div>
    </div>
  </div>
</body>

</html>
